name: Build Windows 32-bit EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Memungkinkan build manual lewat tombol di tab Actions

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.8 (32-bit untuk kompatibilitas Windows 7)
        uses: actions/setup-python@v5
        with:
          python-version: '3.8.10'
          architecture: 'x86'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pymysql pyinstaller

      - name: Build EXE dengan PyInstaller
        run: |
          pyinstaller --onefile --noconsole --name "RestartDPD" restart_win.py

      - name: Upload hasil build (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: RestartDPD-Windows-32bit
          path: dist/RestartDPD.exe
