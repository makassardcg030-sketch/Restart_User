name: Build Windows 32-bit EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.8 (32-bit untuk kompatibilitas Windows 7)
        uses: actions/setup-python@v5
        with:
          python-version: '3.8.10'
          architecture: 'x86'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pymysql pyinstaller pillow

      - name: Siapkan icon2.png (Gunakan yang ada atau buat default)
        run: |
          python -c "
          import os
          if not os.path.exists('icon2.png'):
              from PIL import Image, ImageDraw
              img = Image.new('RGBA', (256, 256), (0, 0, 0, 0))
              draw = ImageDraw.Draw(img)
              draw.rounded_rectangle([16, 16, 240, 240], radius=56, fill='#217AC7')
              draw.ellipse([64, 64, 192, 192], outline='#FFFFFF', width=22)
              draw.polygon([(145, 36), (195, 76), (145, 112)], fill='#1F9966')
              img.save('icon2.png', format='ICO', sizes=[(256, 256), (128, 128), (64, 64), (32, 32), (16, 16)])
              print('Ikon default icon2.png berhasil dibuat.')
          else:
              print('Menggunakan icon2.png dari repository.')
          "

      - name: Build EXE dengan PyInstaller dan Ikon
        run: |
          pyinstaller --onefile --noconsole --icon="icon2.png" --add-data "icon2.png;." --name "RestartDPD" restart_win.py

      - name: Upload hasil build (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: RestartDPD-Windows-32bit
          path: dist/RestartDPD.exe
